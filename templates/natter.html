<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/natter.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <div class="logo">
                    <div class="logo-circle"></div>
                    <div class="logo-wave"></div>
                </div>
                Natter-TencentCloud-ddns
            </a>
            <div class="nav-links">
                <a href="/natter" class="nav-link active">Natter</a>
                <a href="/ddns" class="nav-link">DDNS</a>
                <a href="/GIT" class="nav-link">Git ID</a>
                <a href="/" class="nav-link">Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="section-title">
            <i class="fas fa-cog"></i>
            Natter Config
        </div>
        
        <h1 class="page-title">Port Configuration</h1>
        
        <form method="POST" action="{{ url_for('natter') }}" id="mainForm">
            {{ form.csrf_token }}
            <input type="hidden" name="save_config" value="true">
            
            <div class="port-cards">
                {% for port_key, port_form in port_forms.items() %}
                <div class="port-card">
                    <div class="port-header">
                        <h2 class="port-title">
                            <i class="fas fa-plug"></i>
                            {{ port_key }}
                        </h2>
                        <button type="submit"
                                formaction="{{ url_for('delete_port', port_key=port_key) }}"
                                formmethod="POST"
                                class="btn btn-danger"
                                onclick="return confirm('确定删除 {{ port_key }} 吗？');">
                            <i class="fas fa-trash"></i>
                            Delete
                        </button>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Record ID</label>
                        <input type="number" name="{{ port_key }}-record_id" class="form-control" 
                               value="{{ display_field_value(port_form.record_id.data) }}"
                               placeholder="Git ID返回的ID（选填）">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Port</label>
                        <input type="number" name="{{ port_key }}-port" class="form-control" 
                               value="{{ display_field_value(port_form.port.data) }}"
                               placeholder="需要穿透的端口号">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Protocol</label>
                        <select name="{{ port_key }}-protocols" class="form-control">
                            <option value="TCP" {% if port_form.protocols.data == 'TCP' %}selected{% endif %}>TCP</option>
                            <option value="UDP" {% if port_form.protocols.data == 'UDP' %}selected{% endif %}>UDP</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Subdomain</label>
                        <input type="text" name="{{ port_key }}-subdomain" class="form-control" 
                               value="{{ display_field_value(port_form.subdomain.data) }}"
                               placeholder="_service._protocol">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Record Line</label>
                        <input type="text" name="{{ port_key }}-record_line" class="form-control" 
                               value="{{ display_field_value(port_form.record_line.data) }}"
                               placeholder="默认">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Priority</label>
                        <input type="text" name="{{ port_key }}-priority" class="form-control" 
                               value="{{ display_field_value(port_form.priority.data) }}"
                               placeholder="0 5">
                    </div>
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="floating-btn floating-save-btn" onclick="return submitForm();">
                <i class="fas fa-save"></i>
                <span class="floating-btn-tooltip">保存配置</span>
            </button>
        </form>

        <form action="{{ url_for('add_port') }}" method="POST" class="add-form">
            {{ form.csrf_token }}
            <button type="submit" class="floating-btn floating-add-btn">
                <i class="fas fa-plus"></i>
                <span class="floating-btn-tooltip">添加配置</span>
            </button>
        </form>
    </div>

    <script>
        function submitForm() {
            document.getElementById('mainForm').submit();
            return false;
        }
    </script>
</body>
</html>
