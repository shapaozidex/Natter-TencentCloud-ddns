<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/natter.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <div class="logo">
                    <div class="logo-circle"></div>
                    <div class="logo-wave"></div>
                </div>
                Natter-TencentCloud-ddns
            </a>
            <div class="nav-links">
                <a href="/natter" class="nav-link">Natter</a>
                <a href="/ddns" class="nav-link">DDNS</a>
                <a href="/GIT" class="nav-link">Git ID</a>
                <a href="/" class="nav-link active">Home</a>
            </div>
        </div>
    </nav>

    <div class="dashboard">
        <div class="section-title">
            <i class="fas fa-chart-line"></i>
            System Status
        </div>
        
        <div class="status-cards">
            <div class="status-card">
                <h2><i class="fas fa-network-wired"></i> Natter Status</h2>
                <div class="control-buttons">
                    <form method="POST" action="{{ url_for('NATTER') }}">
                        {{ form.csrf_token }}
                        <button type="submit" name="natter_button_clicked" value="true" class="control-btn">
                            <i class="fas fa-play"></i>
                            启动 Natter
                        </button>
                    </form>
                </div>
            </div>
            <div class="status-card">
                <h2><i class="fas fa-globe"></i> DDNS Status</h2>
                <div class="control-buttons">
                    <form method="POST" action="{{ url_for('DDNS') }}">
                        {{ form.csrf_token }}
                        <button type="submit" name="ddns_button_clicked" value="true" class="control-btn">
                            <i class="fas fa-play"></i>
                            启动 DDNS
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="log-section">
            <div class="log-header">
                <h2 class="log-title">
                    <i class="fas fa-terminal"></i>
                    Natter Logs
                </h2>
                <button onclick="location.reload()" class="refresh-btn">
                    <i class="fas fa-sync-alt"></i>
                    刷新日志
                </button>
            </div>
            <div class="log-content">{{ natter_log }}</div>
        </div>

        <div class="log-section">
            <div class="log-header">
                <h2 class="log-title">
                    <i class="fas fa-terminal"></i>
                    DDNS Logs
                </h2>
                <button onclick="location.reload()" class="refresh-btn">
                    <i class="fas fa-sync-alt"></i>
                    刷新日志
                </button>
            </div>
            <div class="log-content">{{ ddns_log }}</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logContents = document.querySelectorAll('.log-content');
            logContents.forEach(log => {
                log.scrollTop = log.scrollHeight;
            });

            const refreshBtns = document.querySelectorAll('.refresh-btn');
            refreshBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    this.classList.add('clicked');
                    setTimeout(() => {
                        location.reload();
                    }, 300);
                });
            });

            // Add ripple effect to control buttons
            document.querySelectorAll('.control-btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    let ripple = document.createElement('span');
                    ripple.classList.add('ripple');
                    
                    // Get click position relative to the button
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    
                    this.appendChild(ripple);
                    
                    ripple.addEventListener('animationend', () => {
                        ripple.remove();
                    });
                });
            });
        });
    </script>
</body>
</html>
